[project]
name = "ai-engineering-company-project-monorepo-miguelmillan"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
nightly = [
    "prefect>=3.9.3",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.1.8",
    "sqlmodel>=0.0.50",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev", "nightly"]
