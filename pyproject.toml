[project]
name = "ai-engineering-company-project-monorepo-miguelmillan"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.6",
    "fastmcp>=3.2,<4",
    "httpx>=0.28,<1",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "matplotlib>=3.11.2",
    "mcp>=1.24,<2",
    "mcpauth==0.2.0b1",
    "openai>=1.60",
    "pandas>=3.1.1",
    "python-dotenv>=1.0",
    "qdrant-client>=1.13",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
]
nightly = [
    "prefect>=3.9.3",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.1.8",
    "sqlmodel>=0.0.50",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev", "nightly"]
