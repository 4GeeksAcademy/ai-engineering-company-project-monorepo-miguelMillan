name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Instalar Python y dependencias (uv.lock)
        run: |
          uv python install
          uv sync --frozen

      - name: Tests de pipelines (incluye CV temporal del pronóstico)
        run: uv run pytest tests/pipelines -v

      - name: Suite completa de tests/
        run: uv run pytest tests -q
