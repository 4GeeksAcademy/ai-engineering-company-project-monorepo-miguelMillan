# Endurecimiento común (docs/security/server-hardening.md): sin root dentro del contenedor, sin capacidades del kernel y
# sin escalada por setuid. APP_UID/APP_GID deben ser los del usuario dueño de mock_data/raw/rfp en el host.
x-hardened: &hardened
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  interfaces:
    build: ./uis
    init: true
    environment:
      UI_HOST: ${UI_HOST:?Configura UI_HOST en .env}
      WEBSITE_PORT: ${WEBSITE_PORT:?Configura WEBSITE_PORT en .env}
      BACKOFFICE_PORT: ${BACKOFFICE_PORT:?Configura BACKOFFICE_PORT en .env}
      API_PROXY_TARGET: ${API_PROXY_TARGET:?Configura API_PROXY_TARGET en .env}
      AUTH_PROXY_TARGET: ${AUTH_PROXY_TARGET:?Configura AUTH_PROXY_TARGET en .env}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?Configura NEXT_PUBLIC_INVENTORY_API_URL en .env}
      VITE_API_URL: ${VITE_API_URL-}
      VITE_INVENTORY_API_URL: ${VITE_INVENTORY_API_URL-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:?Configura el host permitido en .env}
      WEBSITE_HEALTH_URL: ${WEBSITE_HEALTH_URL:?Configura WEBSITE_HEALTH_URL en .env}
      BACKOFFICE_HEALTH_URL: ${BACKOFFICE_HEALTH_URL:?Configura BACKOFFICE_HEALTH_URL en .env}
    ports:
      - "${BIND_ADDRESS:?Configura BIND_ADDRESS en .env}:${WEBSITE_PORT}:3000"
      - "${BIND_ADDRESS}:${BACKOFFICE_PORT}:3001"
    volumes:
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      - website_dependencies:/app/uis/website/node_modules
      - backoffice_dependencies:/app/uis/backoffice/node_modules
    networks:
      - trackflow
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "for (const url of [process.env.WEBSITE_HEALTH_URL, process.env.BACKOFFICE_HEALTH_URL]) { const response = await fetch(url, { signal: AbortSignal.timeout(4000) }); if (!response.ok) process.exit(1) }"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

  backend:
    <<: *hardened
    image: trackflow-backend:local
    environment:
      APP_ENV: ${APP_ENV:-production}   # production: sin /docs ni /openapi.json
      AI_KILL_SWITCH_FILE: /var/lib/trackflow/AI_STOP   # trackflow-ctl ai-stop / ai-start
      HOME: /tmp
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en Codespaces}
      REDIS_URL: redis://redis:6379/0
      TASKS_INTERNAL_TOKEN: ${TASKS_INTERNAL_TOKEN:?Configura TASKS_INTERNAL_TOKEN en .env}
      TASK_INPUT_DIR: /var/lib/trackflow/task-inputs
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_CACHE_DIR: /var/lib/trackflow/fastembed
      AGENT_DATA_DIR: /var/lib/trackflow/agent
      # Memoria del agente: Redis del stack, base 2 (Celery usa la 0). Nunca la colección RAG de Qdrant.
      AGENT_MEMORY_REDIS_URL: redis://redis:6379/2
      RFP_RAW_DIR: /app/mock_data/raw/rfp
      # El agente usa las tools a través del servidor MCP (servicio `mcp`), con OAuth client_credentials.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:8090/mcp}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      AGENT_OAUTH_CLIENT_ID: ${AGENT_OAUTH_CLIENT_ID:-}
      AGENT_OAUTH_CLIENT_SECRET: ${AGENT_OAUTH_CLIENT_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    build:
      context: ./services
      additional_contexts:
        scripts: ./scripts
        shared: ./packages/shared
        telemetry_schema: ./docs/telemetry
    init: true
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS}:${API_PORT:?Configura API_PORT en .env}:8080"
      - "${BIND_ADDRESS}:${AUTH_PORT:?Configura AUTH_PORT en .env}:8081"
    volumes:
      - ./services/api:/app/services/api
      - ./scripts:/app/scripts:ro
      - ./packages/shared:/app/packages/shared:ro
      - ./mock_data:/app/mock_data:ro
      # Recepción de RFP: los PDF subidos se guardan aquí (data/raw del BRIEFING); escribible y compartido con el worker.
      - ${RFP_RAW_HOST_DIR:-./mock_data/raw/rfp}:/app/mock_data/raw/rfp
      - ./services/agent:/app/services/agent:ro
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - backend_data:/var/lib/trackflow
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "for (const url of [process.env.GATEWAY_HEALTH_URL, process.env.API_HEALTH_URL]) { const response = await fetch(url, { signal: AbortSignal.timeout(4000) }); if (!response.ok) process.exit(1) }"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

  mcp:
    <<: *hardened
    # Servidor MCP de TrackFlow (mcps/trackflow_mcp). Opcional: `docker compose --profile mcp up`.
    # Necesita un proveedor OAuth 2.1/OIDC (OIDC_ISSUER) y la cuenta de servicio del backend.
    profiles: ["mcp"]
    image: trackflow-backend:local
    working_dir: /app
    command: ["python", "-m", "mcps.trackflow_mcp.server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8090"
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://mcp:8090/mcp}
      MCP_ALLOWED_HOSTS: mcp
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      TRACKFLOW_API_BASE_URL: http://backend:8081
      MCP_BACKEND_EMAIL: ${MCP_BACKEND_EMAIL:-}
      MCP_BACKEND_PASSWORD: ${MCP_BACKEND_PASSWORD:-}
    volumes:
      - ./mcps:/app/mcps:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trackflow

  redis:
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]  # solo para pasar de root al usuario redis al arrancar
    security_opt: ["no-new-privileges:true"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      # Sin contraseña: SIEMPRE loopback (desarrollo en el host). Nunca BIND_ADDRESS: antes quedaba abierto con 0.0.0.0.
      - "127.0.0.1:6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    security_opt: ["no-new-privileges:true"]
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"   # sin API key: solo loopback
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - trackflow
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    <<: *hardened
    image: trackflow-backend:local
    command: ["celery", "-A", "celery_app:app", "worker", "--loglevel=INFO"]
    init: true
    # Sin env_file: el worker procesa PDF y CSV de terceros y no necesita SECRET_KEY, OAuth ni el correo.
    environment:
      HOME: /tmp
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en Codespaces}
      AI_KILL_SWITCH_FILE: /var/lib/trackflow/AI_STOP
      LLM_MAX_CALLS_PER_HOUR: ${LLM_MAX_CALLS_PER_HOUR:-600}
      RFP_MAX_ITERATIONS: ${RFP_MAX_ITERATIONS:-}
      RFP_AUTO_GENERATE: ${RFP_AUTO_GENERATE:-1}
      RFP_AUTO_APPROVAL: ${RFP_AUTO_APPROVAL:-1}
      TASK_INPUT_DIR: /var/lib/trackflow/task-inputs
      # Pipeline de recepción de RFP (mock_data/pipelines/rfp_intake): LLM de generación y PDFs subidos.
      RFP_RAW_DIR: /app/mock_data/raw/rfp
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
    volumes:
      - ./services/api:/app/services/api
      - ./scripts:/app/scripts:ro
      - ./packages/shared:/app/packages/shared:ro
      - ./mock_data:/app/mock_data:ro
      - ${RFP_RAW_HOST_DIR:-./mock_data/raw/rfp}:/app/mock_data/raw/rfp
      - backend_data:/var/lib/trackflow
    networks:
      - trackflow
    depends_on:
      redis:
        condition: service_healthy

  flower:
    <<: *hardened
    image: trackflow-backend:local
    command: ["celery", "-A", "celery_app:app", "flower", "--address=0.0.0.0", "--port=5555", "--basic-auth=${FLOWER_BASIC_AUTH:?Configura FLOWER_BASIC_AUTH como usuario:contraseña en .env}"]
    init: true
    environment:   # sin env_file: Flower no necesita ningún secreto de la aplicación
      HOME: /tmp
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"   # Flower puede revocar tareas: solo por túnel SSH
    volumes:
      - ./services/api:/app/services/api
    networks:
      - trackflow
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

networks:
  trackflow:
    name: ${DOCKER_NETWORK_NAME:?Configura DOCKER_NETWORK_NAME en .env}
    driver: bridge

volumes:
  backend_data:
  redis_data:
  qdrant_data:
  website_dependencies:
  backoffice_dependencies: