services:
  interfaces:
    build: ./uis
    init: true
    environment:
      UI_HOST: ${UI_HOST:?Configura UI_HOST en .env}
      WEBSITE_PORT: ${WEBSITE_PORT:?Configura WEBSITE_PORT en .env}
      BACKOFFICE_PORT: ${BACKOFFICE_PORT:?Configura BACKOFFICE_PORT en .env}
      API_PROXY_TARGET: ${API_PROXY_TARGET:?Configura API_PROXY_TARGET en .env}
      AUTH_PROXY_TARGET: ${AUTH_PROXY_TARGET:?Configura AUTH_PROXY_TARGET en .env}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?Configura NEXT_PUBLIC_INVENTORY_API_URL en .env}
      VITE_API_URL: ${VITE_API_URL-}
      VITE_INVENTORY_API_URL: ${VITE_INVENTORY_API_URL-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:?Configura el host permitido en .env}
      WEBSITE_HEALTH_URL: ${WEBSITE_HEALTH_URL:?Configura WEBSITE_HEALTH_URL en .env}
      BACKOFFICE_HEALTH_URL: ${BACKOFFICE_HEALTH_URL:?Configura BACKOFFICE_HEALTH_URL en .env}
    ports:
      - "${BIND_ADDRESS:?Configura BIND_ADDRESS en .env}:${WEBSITE_PORT}:3000"
      - "${BIND_ADDRESS}:${BACKOFFICE_PORT}:3001"
    volumes:
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      - website_dependencies:/app/uis/website/node_modules
      - backoffice_dependencies:/app/uis/backoffice/node_modules
    networks:
      - trackflow
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "for (const url of [process.env.WEBSITE_HEALTH_URL, process.env.BACKOFFICE_HEALTH_URL]) { const response = await fetch(url, { signal: AbortSignal.timeout(4000) }); if (!response.ok) process.exit(1) }"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

  backend:
    image: trackflow-backend:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en Codespaces}
      REDIS_URL: redis://redis:6379/0
      TASKS_INTERNAL_TOKEN: ${TASKS_INTERNAL_TOKEN:?Configura TASKS_INTERNAL_TOKEN en .env}
      TASK_INPUT_DIR: /var/lib/trackflow/task-inputs
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_CACHE_DIR: /var/lib/trackflow/fastembed
      AGENT_DATA_DIR: /var/lib/trackflow/agent
      AGENT_API_BASE_URL: http://127.0.0.1:8081
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    build:
      context: ./services
      additional_contexts:
        scripts: ./scripts
        shared: ./packages/shared
        telemetry_schema: ./docs/telemetry
    init: true
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS}:${API_PORT:?Configura API_PORT en .env}:8080"
      - "${BIND_ADDRESS}:${AUTH_PORT:?Configura AUTH_PORT en .env}:8081"
    volumes:
      - ./services/api:/app/services/api
      - ./scripts:/app/scripts:ro
      - ./packages/shared:/app/packages/shared:ro
      - ./mock_data:/app/mock_data:ro
      - ./services/agent:/app/services/agent:ro
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - backend_data:/var/lib/trackflow
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "for (const url of [process.env.GATEWAY_HEALTH_URL, process.env.API_HEALTH_URL]) { const response = await fetch(url, { signal: AbortSignal.timeout(4000) }); if (!response.ok) process.exit(1) }"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${BIND_ADDRESS:?Configura BIND_ADDRESS en .env}:6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${BIND_ADDRESS:?Configura BIND_ADDRESS en .env}:${QDRANT_PORT:-6333}:6333"
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - trackflow
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    image: trackflow-backend:local
    command: ["celery", "-A", "celery_app:app", "worker", "--loglevel=INFO"]
    init: true
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en Codespaces}
      TASKS_INTERNAL_TOKEN: ${TASKS_INTERNAL_TOKEN:?Configura TASKS_INTERNAL_TOKEN en .env}
      TASK_INPUT_DIR: /var/lib/trackflow/task-inputs
    volumes:
      - ./services/api:/app/services/api
      - ./scripts:/app/scripts:ro
      - ./packages/shared:/app/packages/shared:ro
      - backend_data:/var/lib/trackflow
    networks:
      - trackflow
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: trackflow-backend:local
    command: ["celery", "-A", "celery_app:app", "flower", "--address=0.0.0.0", "--port=5555", "--basic-auth=${FLOWER_BASIC_AUTH:?Configura FLOWER_BASIC_AUTH como usuario:contraseña en .env}"]
    init: true
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BIND_ADDRESS:?Configura BIND_ADDRESS en .env}:5555:5555"
    volumes:
      - ./services/api:/app/services/api
    networks:
      - trackflow
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

networks:
  trackflow:
    name: ${DOCKER_NETWORK_NAME:?Configura DOCKER_NETWORK_NAME en .env}
    driver: bridge

volumes:
  backend_data:
  redis_data:
  qdrant_data:
  website_dependencies:
  backoffice_dependencies: