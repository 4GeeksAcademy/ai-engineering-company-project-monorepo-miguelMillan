[project]
name = "trackflow-suppliers"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "libpass[bcrypt]>=1.9.3",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.10,<3",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.48",
    "tinydb>=4.8,<5",
    "uvicorn>=0.34,<1",
]

[project.scripts]
seed = "seed:main"
seed-inventory = "inventory_seed:main"
serve = "main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "schemas", "database", "seed", "inventory_seed", "security", "user_service", "password_recovery"]
packages = ["routes"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
