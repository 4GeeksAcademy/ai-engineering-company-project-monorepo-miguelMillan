[project]
name = "trackflow-suppliers"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4.21,<5",
    "libpass[bcrypt]>=1.9.3",
    "psycopg2-binary>=2.9.13",
    "pandas>=2.2,<3",
    "pydantic[email]>=2.10,<3",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.48",
    "tinydb>=4.8,<5",
    "uvicorn>=0.34,<1",
    "prefect>=3,<4",
    "celery>=5.7.0",
    "redis>=8.1.0",
    "flower>=2.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.13",
    "openai>=1.60",
    "fastembed>=0.6",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "fastmcp>=3.2,<4",
    "mcp>=1.24,<2",
    "mcpauth==0.2.0b1",
    "langchain-mcp-adapters>=0.3.2",
    "markitdown[pdf]>=0.1.9",
    "py-readability-metrics>=1.4.5",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
seed = "seed:main"
seed-inventory = "inventory_seed:main"
serve = "main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
    "pytest-cov>=7.1.0",
    "fakeredis>=2.40.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "schemas", "database", "seed", "inventory_seed", "security", "user_service", "password_recovery", "celery_app", "task_storage", "tasks"]
packages = ["routes"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
